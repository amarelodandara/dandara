name: uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      base:
        description: Base URL to check
        required: false
        default: https://adandara.com

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Smoke production
        id: smoke
        continue-on-error: true
        env:
          SMOKE_BASE_URL: ${{ inputs.base || 'https://adandara.com' }}
        run: npm run smoke 2>&1 | tee smoke.log

      - name: Open or update the outage issue
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const log = fs.readFileSync("smoke.log", "utf8").slice(-4000);
            const body = [
              `Smoke check failed at ${new Date().toISOString()}.`,
              "",
              "```",
              log,
              "```",
              "",
              `[Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) · rollback steps in DEPLOYS.md`,
            ].join("\n");

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: "outage",
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open[0].number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              ...context.repo,
              title: "Production smoke check is failing",
              labels: ["outage"],
              body,
            });

      - name: Close the outage issue
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: "outage",
            });

            for (const issue of open) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `Smoke check passed at ${new Date().toISOString()}. Closing.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Fail the run when the smoke check failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
