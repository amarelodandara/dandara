name: uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      base:
        description: Base URL to check
        required: false
        default: https://adandara.com

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Smoke production
        env:
          SMOKE_BASE_URL: ${{ inputs.base }}
        run: npm run smoke
